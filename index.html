<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thura Tech — Managerial Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#fff;
  --ink:#141C26; --ink2:#42505F; --muted:#7C8899;
  --line:#DDE3E9; --line2:#EDF0F3;
  --neg:#B0341F; --ok:#0E6E63;
  --r:3px; --sc:#0E6E63;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans','IBM Plex Sans Thai',system-ui,sans-serif;font-size:14.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
html[lang=th] body{line-height:1.68}
h1,h2,h3,h4{font-family:'Archivo','Anuphan',sans-serif;font-weight:600;line-height:1.25;letter-spacing:-.01em}
html[lang=th] h1,html[lang=th] h2,html[lang=th] h3,html[lang=th] h4{letter-spacing:0;line-height:1.35}
.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

.shell{display:flex;min-height:100vh}
.rail{width:212px;flex:none;background:var(--ink);color:#C3CCD6;padding:26px 0 20px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;color:#fff;
  display:flex;align-items:baseline;gap:7px}
.brand .mark i{font-style:normal;width:7px;height:7px;border-radius:50%;background:var(--sc);
  transition:background .25s;flex:none;transform:translateY(-2px)}
.brand .sub{font-size:10.5px;color:#7E8B99;letter-spacing:.11em;text-transform:uppercase;margin-top:5px}
.lang{display:flex;margin-top:14px;border:1px solid rgba(255,255,255,.16);border-radius:var(--r);overflow:hidden;width:fit-content}
.lang button{background:none;border:0;color:#8D9AA8;font-family:'IBM Plex Mono',monospace;font-size:11px;
  letter-spacing:.06em;padding:4px 11px;cursor:pointer}
.lang button.on{background:var(--sc);color:#fff;font-weight:600}
.nav{padding:16px 12px;flex:1}
.nav button{width:100%;text-align:left;background:none;border:0;color:#96A3B1;
  font-family:inherit;font-size:13.5px;padding:9px 11px;border-radius:var(--r);cursor:pointer;
  display:flex;gap:11px;align-items:baseline}
.nav button:hover{color:#DCE3EA;background:rgba(255,255,255,.045)}
.nav button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.nav button em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#5D6B7A;width:14px;flex:none}
.nav button.on em{color:var(--sc)}
.railfoot{padding:0 22px;font-size:10.5px;color:#5D6B7A;line-height:1.65}

.main{flex:1;min-width:0}
.page{display:none;padding:34px 40px 90px;max-width:1160px}
.page.on{display:block}
.phead{margin-bottom:24px}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:7px}
.phead h1{font-size:27px}
.phead p{color:var(--ink2);margin-top:8px;max-width:66ch;font-size:14px}

.tabs{display:flex;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;font-family:inherit;
  font-size:13.5px;color:var(--muted);padding:9px 15px 10px;cursor:pointer;margin-bottom:-1px;
  white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--sc);font-weight:600}
.tabs button i{font-style:normal;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35}
.tabs button.on i{opacity:1;background:var(--sc)}
.slogic{background:var(--surface);border:1px solid var(--line);border-top:0;border-left:3px solid var(--sc);
  padding:12px 17px;margin-bottom:22px;font-size:13px;color:var(--ink2)}
.slogic b{color:var(--ink);font-weight:600}
.slogic .fx{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--sc);font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:20px}
.card>h3{font-size:15px}
.cap{font-size:12.5px;color:var(--muted);line-height:1.55}
.cap b{color:var(--ink2);font-weight:600}
.card>h3+.cap{max-width:78ch}
.card>h3+.cap{margin:2px 0 15px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;min-height:26px}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.kpi .u{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi .v.neg{color:var(--neg)} .kpi .v.pos{color:var(--ok)}

.tw{overflow-x:auto;margin:0 -24px;padding:0 24px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:6.5px 10px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;min-width:190px;white-space:normal}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;
  border-bottom:1px solid var(--line);padding-bottom:8px}
tr.head td{font-weight:600;font-size:13.5px;padding-top:13px;border-bottom:1px solid var(--line)}
tr.sub td{color:var(--ink2);font-size:12.5px}
tr.sub td:first-child{padding-left:16px;color:var(--muted)}
tr.total td{font-weight:600;border-top:1px solid var(--ink);border-bottom:2px solid var(--ink);padding:9px 10px}
tr.pct td{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
tr.pct td:first-child{padding-left:16px}
td.neg{color:var(--neg)}
tr.zebra td{background:#FAFBFC}
tr.bd{display:none}
tr.bd.on{display:table-row}
tr.bd td{font-size:12px;color:var(--muted);border-bottom:1px dotted var(--line2)}
tr.bd td:first-child{padding-left:34px;font-style:normal}
tr.bd td:first-child::before{content:'└ ';color:var(--line);font-style:normal}
button.exp{background:none;border:1px solid var(--line);border-radius:2px;color:var(--muted);
 font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1;width:15px;height:15px;
 padding:0;margin-right:7px;cursor:pointer;vertical-align:1px}
button.exp:hover{border-color:var(--sc);color:var(--sc)}
button.exp.on{background:var(--sc);border-color:var(--sc);color:#fff}
button.exp:focus:not(:focus-visible){outline:none}
button.exp:focus-visible{outline:1px solid var(--sc);outline-offset:2px}
.bdnote{font-size:11.5px;color:var(--muted);margin-top:11px;line-height:1.55;max-width:88ch}
td.free{text-align:left;white-space:normal;min-width:0}
table.mth{min-width:900px;font-size:12px}
table.mth th,table.mth td{padding:5.5px 7px}
table.mth th:first-child,table.mth td:first-child{min-width:160px;font-size:12.5px}
table.mth .tot{border-left:1px solid var(--line);font-weight:600;background:#F7F9FA}
table.mth th.tot{color:var(--ink2)}
#mthWrap{margin-top:14px}
#mthWrap .body{padding-bottom:4px}

details{border-top:1px solid var(--line2);margin-top:4px}
details summary{cursor:pointer;list-style:none;padding:11px 0;font-size:12.5px;color:var(--sc);
  font-weight:500;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";font-family:'IBM Plex Mono',monospace;font-size:14px;
  width:15px;height:15px;border:1px solid currentColor;border-radius:2px;display:grid;place-items:center;line-height:1;flex:none}
details[open] summary::before{content:"−"}
details .body{padding:2px 0 16px;font-size:13px;color:var(--ink2)}
details .body p{margin:8px 0}
details .body ul{list-style:none;margin:8px 0}
details .body li{padding:3px 0 3px 16px;position:relative}
details .body li::before{content:"";position:absolute;left:2px;top:13px;width:5px;height:1px;background:var(--muted)}

.doc{max-width:76ch}
.doc h2{font-size:17px;margin:30px 0 8px;padding-top:20px;border-top:1px solid var(--line)}
.doc h2:first-of-type{border-top:0;padding-top:0;margin-top:2px}
.doc h2 em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--sc);margin-right:11px;font-weight:600}
.doc p{margin:8px 0;color:var(--ink2)}
.doc strong{color:var(--ink);font-weight:600}
.doc .tw{margin:14px -24px;padding:0 24px}
.doc table{min-width:400px}
.pull{border-left:3px solid var(--sc);background:#F7F9FA;padding:13px 17px;margin:16px 0;font-size:13.5px;color:var(--ink2)}
.pull strong{color:var(--ink)}

svg.chart{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line2);stroke-width:1}
.zl{stroke:var(--ink);stroke-width:1.25}
.axt{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--muted)}
.cline{fill:none;stroke:var(--sc);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.cfillpos{fill:var(--sc);opacity:.10}
.cfillneg{fill:var(--neg);opacity:.14}
.dotneg{fill:var(--neg);stroke:#fff;stroke-width:1.5}
.mkline{stroke:var(--neg);stroke-width:1;stroke-dasharray:3 3}
.mklab{font-family:'Archivo','Anuphan',sans-serif;font-size:10.5px;fill:var(--neg);font-weight:600}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px;align-items:center}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px;flex:none}

.sim{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc);
  border-radius:var(--r);padding:20px 24px;margin-bottom:20px}
.simtop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.simtop h3{font-size:15px}
.simval{text-align:right}
.simval .amt{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1}
.simval .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:5px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;margin:4px 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-moz-range-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--sc);border:3px solid #fff;box-shadow:0 0 0 1px var(--sc);margin-top:-7px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--sc);
  border:3px solid #fff;box-shadow:0 0 0 1px var(--sc)}
input[type=range]:focus-visible{outline:2px solid var(--sc);outline-offset:4px}
.scale{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
.verdict{margin-top:16px;padding:12px 16px;border-radius:var(--r);font-size:13.5px;display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.verdict.ok{background:#EAF4F2;color:#0A4F47}
.verdict.bad{background:#FBEDEA;color:#8A2917}
.verdict b{font-weight:600}
.verdict .ic{font-family:'IBM Plex Mono',monospace;font-weight:700;flex:none;margin-top:1px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.presets button{font-family:inherit;font-size:12.5px;padding:6px 13px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r);cursor:pointer;color:var(--ink2)}
.presets button:hover{border-color:var(--sc);color:var(--sc)}

.months{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media(max-width:860px){.months{grid-template-columns:1fr}}
.mcol h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;
  padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:2px}
.mrow{display:grid;grid-template-columns:36px 1fr 74px 88px;align-items:center;gap:10px;
  padding:5px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.mrow .m{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11px}
.mrow .bar{height:7px;background:var(--line2);border-radius:2px;position:relative}
.mrow .bar b{position:absolute;top:0;height:7px;border-radius:2px;display:block}
.mrow .net{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--muted);font-size:11.5px}
.mrow .bal{font-family:'IBM Plex Mono',monospace;text-align:right;font-weight:500}
.mrow.short{background:#FDF4F2}
.mrow.short .bal{color:var(--neg)}
.mhead{display:grid;grid-template-columns:36px 1fr 74px 88px;gap:10px;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.mhead span:nth-child(3),.mhead span:nth-child(4){text-align:right}

.tl{border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);min-height:380px;padding:28px;position:relative}
.tlgrid{position:absolute;inset:0;background-image:linear-gradient(to right,var(--line2) 1px,transparent 1px);
  background-size:calc(100%/12) 100%;opacity:.75;pointer-events:none}
.tlq{display:grid;grid-template-columns:repeat(12,1fr);position:relative;z-index:1;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:6px}
.tlq div{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
.lane{border-top:1px solid var(--line2);padding:15px 0 18px;position:relative;z-index:1}
.lane .lname{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.lane .lname i{font-style:normal;width:8px;height:8px;border-radius:2px;flex:none}
.lane .lcap{font-size:11.5px;color:var(--muted)}
.tlempty{position:relative;z-index:1;text-align:center;padding:44px 20px 10px;color:var(--muted)}
.tlempty h4{font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.tlempty p{font-size:12.5px;max-width:50ch;margin:0 auto;line-height:1.6}

.foot{font-size:11.5px;color:var(--muted);margin-top:22px;padding-top:13px;border-top:1px solid var(--line);line-height:1.65}

@media(max-width:820px){
  .shell{flex-direction:column}
  .rail{width:100%;height:auto;position:static;padding:18px 0 10px}
  .brand{padding:0 20px 14px;display:flex;justify-content:space-between;align-items:flex-start}
  .brand .lang{margin-top:0}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:12px 14px}
  .nav button{white-space:nowrap;width:auto}
  .railfoot{display:none}
  .page{padding:24px 18px 70px}
  .tw,.doc .tw,.gwrap{margin:0 -18px;padding:0 18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 04 execution timeline (gantt) ===== */
.gwrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
.gant{min-width:940px}
.ghead{display:grid;grid-template-columns:258px 1fr;align-items:end;
  border-bottom:1px solid var(--line);padding-bottom:7px}
.ghead .gh1{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.gmonths{display:flex}
.gmonths div{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;border-left:1px solid var(--line);padding-left:8px}
.gbody{position:relative}
.gsep{position:absolute;top:0;bottom:0;left:258px;right:0;pointer-events:none;z-index:0}
.gsep i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.gsep b{position:absolute;top:0;bottom:0;border-left:1px dashed var(--neg);opacity:.6}
.gsep u{position:absolute;top:2px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  color:var(--neg);text-decoration:none;margin-left:5px}
.ggroup{position:relative;z-index:1;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:17px 0 5px;border-bottom:1px solid var(--line)}
.grow{position:relative;z-index:1;display:grid;grid-template-columns:258px 1fr;align-items:center;
  border-bottom:1px solid var(--line2);font-size:12.5px}
.gname{padding:5px 14px 5px 0;color:var(--ink2);display:flex;gap:9px;align-items:baseline}
.gname em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex:none;width:26px}
.gtrack{position:relative;height:26px}
.gbar{position:absolute;top:8px;height:10px;border-radius:2px;min-width:5px;z-index:2}
.gblab{position:absolute;top:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--muted);white-space:nowrap;text-decoration:none;z-index:2}
.gmile{position:absolute;top:7px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);z-index:3;border-radius:2px}
.gmlab{position:absolute;top:5px;font-size:10.5px;font-weight:600;white-space:nowrap;
  font-family:'Archivo','Anuphan',sans-serif;text-decoration:none;z-index:3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.chip{font-size:12px;border:1px solid #BFD9D5;background:#F2F8F7;color:#0A4F47;
  border-radius:var(--r);padding:4px 11px;display:flex;gap:7px;align-items:center}
.chip i{font-style:normal;font-size:11px;font-weight:700}
.stat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.stat i{width:7px;height:7px;border-radius:50%;flex:none}
td .stat{font-size:12px}
.crit{font-family:'Archivo','Anuphan',sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;color:var(--neg)}

/* ===== 06 brand ===== */
.swatches{display:flex;gap:15px;flex-wrap:wrap;margin:15px 0 4px}
.sw{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.sw b{display:block;width:78px;height:52px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:7px}
.sw em{font-style:normal;display:block;color:var(--ink2);font-family:'IBM Plex Sans','IBM Plex Sans Thai',sans-serif;font-size:12px;margin-bottom:1px}
.quotes{display:grid;gap:9px;margin:14px 0 4px}
.q{border-left:3px solid var(--sc);background:#F7F9FA;padding:11px 16px;font-size:13.5px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:99px;
  padding:3px 11px;color:var(--ink2);margin:0 6px 7px 0}
.doc ul.tick{list-style:none;margin:10px 0}
.doc ul.tick li{padding:3px 0 3px 17px;position:relative;color:var(--ink2)}
.doc ul.tick li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:1px;background:var(--sc)}

/* ===== 07 marketing plan ===== */
.awaiting{background:#FDF7EE;border:1px solid #E8D7B8;border-left:3px solid #B5720E;
  border-radius:var(--r);padding:13px 17px;margin-bottom:20px;font-size:13px;color:#6E4A0C;line-height:1.6}
.awaiting b{font-weight:600}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;
 text-transform:uppercase;padding:2.5px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.wait{background:#F7F9FA}
.pill.live{border-color:var(--sc);color:var(--sc)}
.pill.risk{border-color:var(--neg);color:var(--neg)}
.gate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 9px;padding-top:16px;border-top:1px solid var(--line)}
.gate h3{font-size:14.5px}
.gate .win{font-size:12px;color:var(--muted)}

/* ================= helpers ================= */
const f1=v=>(v/1e6).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const f0=v=>Math.round(v).toLocaleString('en-US');
const pc=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
const THB=v=>(v<0?'−฿':'฿')+(Math.abs(v)/1e6).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})+'M';
const setAccent=k=>document.documentElement.style.setProperty('--sc',SC[k].color);
const bal=(k,cap)=>D[k].cf.map(v=>v+(cap-CAP0));
const minCap=k=>CAP0-Math.min(0,Math.min(...D[k].cf));
const minCapBuf=k=>minCap(k)+3*D[k].opexmo;
const roundUp=(v,s)=>Math.ceil(v/s)*s;
function stagedPlan(k,cap,floor){
  const cf=D[k].cf; let add=0,out=[];
  for(let m=0;m<cf.length;m++){
    const b=cf[m]+(cap-CAP0)+add;
    if(b<floor){const amt=Math.ceil((floor-b)/500000)*500000;out.push([m+1,amt]);add+=amt;}
  }
  return {list:out,total:add};
}

const expBtn=g=>`<button class="exp${OPEN.has(g)?' on':''}" data-g="${g}" `

function GRPA(d,g,kids){
  const cells=a=>a.map(v=>`<td class="n ${v<0?'neg':''}">${f1(v)}</td>`).join('');
  let out=`<tr class="sub"><td>${expBtn(g)}${t(g)}</td>${cells(d[g])}</tr>`;
  kids.forEach(kk=>{out+=`<tr class="bd${OPEN.has(g)?' on':''}" data-c="${g}"><td>${t(kk)}</td>${cells(d[kk])}</tr>`});
  return out;
}
function GRPM(m,g,kids){
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const cells=a=>a.map(v=>`<td class="n ${v<0?'neg':''}">${f1(v)}</td>`).join('')
    +`<td class="n tot ${sum(a)<0?'neg':''}">${f1(sum(a))}</td>`;
  let out=`<tr class="sub"><td>${expBtn(g)}${t(g)}</td>${cells(m[g])}</tr>`;
  kids.forEach(kk=>{out+=`<tr class="bd${OPEN.has(g)?' on':''}" data-c="${g}"><td>${t(kk)}</td>${cells(m[kk])}</tr>`});
  return out;
}

function chart(vals){
  const W=920,H=250,PL=50,PR=14,PT=16,PB=28,iw=W-PL-PR,ih=H-PT-PB;
  const mx=Math.max(...vals,1e6),mn=Math.min(...vals,-1e6),pad=(mx-mn)*.08;
  const hi=mx+pad,lo=mn-pad;
  const X=i=>PL+i*(iw/(vals.length-1)),Y=v=>PT+(hi-v)/(hi-lo)*ih,y0=Y(0);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area=`M ${X(0)},${y0.toFixed(1)} L ${pts.split(' ').join(' L ')} L ${X(vals.length-1).toFixed(1)},${y0.toFixed(1)} Z`;
  let grid='';const step=Math.max(1e6,Math.ceil((hi-lo)/5/1e6)*1e6);
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)
    grid+=`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axt" x="${PL-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${(v/1e6).toFixed(0)}M</text>`;
  let xl='';for(let i=0;i<vals.length;i+=3)xl+=`<text class="axt" x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle">M${i+1}</text>`;
  const fn=vals.findIndex(v=>v<0);
  const lab=LANG==='en'?`Cash out M${fn+1}`:`เงินหมด M${fn+1}`;
  const mk=fn<0?'':`<line class="mkline" x1="${X(fn).toFixed(1)}" x2="${X(fn).toFixed(1)}" y1="${PT}" y2="${H-PB}"/><text class="mklab" x="${(X(fn)+6).toFixed(1)}" y="${PT+11}">${lab}</text>`;
  const ti=vals.indexOf(Math.min(...vals));
  const dd=vals[ti]<0?`<circle class="dotneg" cx="${X(ti).toFixed(1)}" cy="${Y(vals[ti]).toFixed(1)}" r="4.5"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><clipPath id="cp"><rect x="${PL}" y="${PT}" width="${iw}" height="${Math.max(0,y0-PT).toFixed(1)}"/></clipPath>
    <clipPath id="cn"><rect x="${PL}" y="${y0.toFixed(1)}" width="${iw}" height="${Math.max(0,H-PB-y0).toFixed(1)}"/></clipPath></defs>
    ${grid}<path class="cfillpos" d="${area}" clip-path="url(#cp)"/><path class="cfillneg" d="${area}" clip-path="url(#cn)"/>
    <line class="zl" x1="${PL}" x2="${W-PR}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>
    ${mk}<polyline class="cline" points="${pts}"/>${dd}${xl}</svg>`;
}

          th:['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.']};
function monthly(b,cap){
  const nets=b.map((v,i)=>i?v-b[i-1]:v-cap);
  const scale=Math.max(...b.map(Math.abs),1);
  const row=i=>{
    const v=b[i],net=nets[i],neg=v<0,w=Math.min(100,Math.abs(v)/scale*100);
    const col=neg?'var(--neg)':'var(--sc)';
    const bar=neg?`<b style="right:50%;width:${w/2}%;background:${col}"></b>`
                 :`<b style="left:50%;width:${w/2}%;background:${col}"></b>`;
    const nf=Math.abs(net)>=1e5?(Math.abs(net)/1e6).toFixed(1)+'M':Math.round(Math.abs(net)/1e3)+'k';
    return `<div class="mrow ${neg?'short':''}"><span class="m">${MN[LANG][i%12]}</span>
      <span class="bar">${bar}</span><span class="net">${net>=0?'+':'−'}${nf}</span>
      <span class="bal">${THB(v)}</span></div>`;
  };
  const head=`<div class="mhead"><span></span><span></span><span>${t('mNet')}</span><span>${t('mBal')}</span></div>`;
  return `<div class="mcol"><h4>${t('y1')}</h4>${head}${[...Array(12).keys()].map(row).join('')}</div>
          <div class="mcol"><h4>${t('y2')}</h4>${head}${[...Array(12).keys()].map(i=>row(i+12)).join('')}</div>`;
}

function update(){

  const b=bal(k,cap),d=D[k];
  const trough=Math.min(...b),ti=b.indexOf(trough),fn=b.findIndex(v=>v<0),safe=trough>=0;
  const need=roundUp(minCap(k),250000), plan=stagedPlan(k,cap,0);
  const el=document.getElementById('simamt');
  el.textContent=THB(cap); el.style.color=safe?'var(--ok)':'var(--neg)';

  const v=document.getElementById('verdict');
  v.className='verdict '+(safe?'ok':'bad');
  v.innerHTML= safe
    ? (LANG==='en'
       ? `<span class="ic">✓</span><div>Cash stays positive for all 24 months. Lowest point is <b>${THB(trough)}</b> in month ${ti+1}.${cap>need?` You could go as low as <b>${THB(need)}</b> and still clear zero.`:''}</div>`
       : `<span class="ic">✓</span><div>เงินสดเป็นบวกตลอด 24 เดือน จุดต่ำสุดอยู่ที่ <b>${THB(trough)}</b> ในเดือนที่ ${ti+1}${cap>need?` ลดลงได้ถึง <b>${THB(need)}</b> ก็ยังไม่ติดลบ`:''}</div>`)
    : (LANG==='en'
       ? `<span class="ic">!</span><div>Cash runs out in <b>month ${fn+1}</b> and bottoms at <b>${THB(trough)}</b> in month ${ti+1}. Raise starting capital to <b>${THB(need)}</b>, or top up ${plan.total?`<b>${THB(plan.total)}</b> across ${plan.list.length} injections starting month ${plan.list[0][0]}`:'later'}.</div>`
       : `<span class="ic">!</span><div>เงินหมดใน <b>เดือนที่ ${fn+1}</b> และต่ำสุดที่ <b>${THB(trough)}</b> ในเดือนที่ ${ti+1} ต้องเพิ่มทุนตั้งต้นเป็น <b>${THB(need)}</b> หรือทยอยเติม ${plan.total?`<b>${THB(plan.total)}</b> รวม ${plan.list.length} ครั้ง เริ่มเดือนที่ ${plan.list[0][0]}`:''}</div>`);

  document.getElementById('kpi3').innerHTML=[
    [t('kRunway'),safe?'24+ '+t('uMo'):fn+' '+t('uMo'),safe?t('uNoShort'):t('uUntilOut'),safe?'pos':'neg'],
    [t('kLowest'),THB(trough),t('uMonth')+' '+(ti+1),trough<0?'neg':'pos'],
    [t('kMinCap'),THB(need),t('uToZero'),''],
    [t('kBuffer'),THB(minCapBuf(k)),t('uRecommended'),''],
    [t('kTopup'),plan.total?THB(plan.total):'—',plan.total?plan.list.length+' '+t('uInjections'):t('uNotNeeded'),''],
    [t('kBurn'),THB(d.opexmo),t('uY1opex'),'']
  ].map(x=>`<div class="kpi"><div class="k">${x[0]}</div><div class="v ${x[3]||''}">${x[1]}</div><div class="u">${x[2]}</div></div>`).join('');

  document.getElementById('months3').innerHTML=monthly(b,cap);
  document.getElementById('chart3').innerHTML=chart(b);
}

const dn=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5);
const G0=dn('2026-08-15'), GN=86;
const GMON=[[8,0,17],[9,17,30],[10,47,31],[11,78,8]];
const MCAL={en:{8:'Aug',9:'Sep',10:'Oct',11:'Nov'},th:{8:'ส.ค.',9:'ก.ย.',10:'ต.ค.',11:'พ.ย.'}};
const LAUNCH='2026-10-05';
const gp=s=>(dn(s)-G0)/GN*100;
const gw=(s,e)=>(dn(e)-dn(s)+1)/GN*100;
const dlab=s=>{const d=new Date(s+'T00:00:00Z');return d.getUTCDate()+' '+MCAL[LANG][d.getUTCMonth()+1]};
const win=x=>!x.s?'—':x.open?dlab(x.s)+' →':(x.s===x.e?dlab(x.s):dlab(x.s)+' – '+dlab(x.e));
function tdNum(){const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}

function gRow(x){
  const c=ST[x.st].c, p=gp(x.s);
  let inner;
  if(x.mile){
    const lab=x.lab?t(x.lab):dlab(x.s);
    const pos=p>66?`right:${(100-p).toFixed(2)}%;margin-right:13px;text-align:right`:`left:${p.toFixed(2)}%;margin-left:13px`;
    inner=`<div class="gmile" style="left:${p.toFixed(2)}%;background:${c}"></div>`
        + `<u class="gmlab" style="${pos};color:${c}">${lab}</u>`;
  }else{
    const w=gw(x.s,x.e), pe=p+w;
    const pos=pe>66?`right:${(100-p).toFixed(2)}%;margin-right:9px;text-align:right`:`left:${pe.toFixed(2)}%;margin-left:9px`;
    inner=`<div class="gbar" style="left:${p.toFixed(2)}%;width:${w.toFixed(2)}%;background:${c}"></div>`
        + `<u class="gblab" style="${pos}">${win(x)}</u>`;
  }
  return `<div class="grow"><div class="gname"><em>${x.id}</em>${x.n[LANG]}</div><div class="gtrack">${inner}</div></div>`;
}
function gGroup(g){
  const rows=TASKS.filter(x=>x.g===g&&x.s);
  if(!rows.length) return '';
  return `<div class="ggroup">${GRP[g][LANG]}</div>`+rows.map(gRow).join('');
}
function gSep(){
  let s=GMON.filter(m=>m[1]>0).map(m=>`<i style="left:${(m[1]/GN*100).toFixed(2)}%"></i>`).join('');
  const p=(tdNum()-G0)/GN*100;
  if(p>=0&&p<=100) s+=`<b style="left:${p.toFixed(2)}%"></b><u style="left:${p.toFixed(2)}%">${t('today')}</u>`;
  return `<div class="gsep">${s}</div>`;
}
function gantt(k){
  let h='';
  const chips=(k==='all')?TASKS.filter(x=>x.g==='strat'):[];
  if(chips.length) h+=`<div class="ggroup" style="border-bottom:0">${GRP.strat[LANG]} · ${t('doneBefore')}</div>`
    +`<div class="chips">${chips.map(x=>`<span class="chip"><i>✓</i>${x.n[LANG]}</span>`).join('')}</div>`;
  const groups=(k==='all')?['prod','mkt','team']:[k];
  h+=`<div class="gwrap"><div class="gant">
    <div class="ghead"><div class="gh1">${t('thTask')}</div>
      <div class="gmonths">${GMON.map(m=>`<div style="width:${(m[2]/GN*100).toFixed(2)}%">${MCAL[LANG][m[0]]} 26</div>`).join('')}</div></div>
    <div class="gbody">${gSep()}${groups.map(gGroup).join('')}</div>
  </div></div>`;
  return h;
}
function tlTable(k){
  const rows=(k==='all')?TASKS:TASKS.filter(x=>x.g===k);
  return `<table><thead><tr><th>${t('thTask')}</th><th style="text-align:left">${t('thWindow')}</th>
    <th style="text-align:left">${t('thStatus')}</th><th style="text-align:left">${t('thNote')}</th></tr></thead><tbody>`
   + rows.map((x,i)=>`<tr class="${i%2?'zebra':''}">
      <td><em style="font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-right:9px">${x.id}</em>${x.n[LANG]}</td>
      <td class="free n">${win(x)}</td>
      <td class="free"><span class="stat"><i style="background:${ST[x.st].c}"></i>${t(ST[x.st].k)}</span></td>
      <td class="free">${x.note?x.note[LANG]:'—'}</td></tr>`).join('')
   + '</tbody></table>';
}
function renderTL(k){
  curTL=k; setAccent('best');
  const tabs={all:t('tlAllTab'),prod:GRP.prod[LANG],mkt:GRP.mkt[LANG],team:GRP.team[LANG]};
  document.getElementById('tabs4').innerHTML=Object.keys(tabs).map(j=>
    `<button class="${j===k?'on':''}" data-t2="${j}"><i></i>${tabs[j]}</button>`).join('');
  document.getElementById('logic4').innerHTML=`<b>${tabs[k]}</b> — ${TLD[k][LANG]}`;

  const days=dn(LAUNCH)-tdNum();
  const nd=TASKS.filter(x=>x.st==='done').length, np=TASKS.filter(x=>x.st==='process').length;
  document.getElementById('kpi4').innerHTML=[
    [t('kToLaunch'),days>0?days:0,t('uDays')+' · '+dlab(LAUNCH)+' 2026',days>0?'':'pos'],
    [t('kTasks'),TASKS.length,'',''],
    [t('kDone'),nd,t('uOf')+' '+TASKS.length,'pos'],
    [t('kRunning'),np,t('uOf')+' '+TASKS.length,''],
    [t('kCrit'),PARTNERS.filter(p=>p.crit).length,t('uBy15Sep'),'neg'],
    [t('kPhase2'),dlab('2026-11-01'),t('uWithBank'),'']
  ].map(x=>`<div class="kpi"><div class="k">${x[0]}</div><div class="v ${x[3]}">${x[1]}</div><div class="u">${x[2]}</div></div>`).join('');

  document.getElementById('gantt4').innerHTML=gantt(k);
  document.getElementById('legend4').innerHTML=['done','process','plan','tbc']
    .map(s=>`<span><i style="background:${ST[s].c}"></i>${t(ST[s].k)}</span>`).join('')
    +`<span><i style="background:var(--neg);height:1px"></i>${t('today')}</span>`;
  document.getElementById('tltable').innerHTML=tlTable(k);
}
